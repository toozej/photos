baseURL = "https://photos.toozej.com/"
locale = "en-US"
title = "Photos"
theme = "hugo-theme-folio-deluxe"
enableRobotsTXT = true

[taxonomies]
    category = "categories"

# Publish processed images. Keep original files and manifests private.
[cascade.build]
    publishResources = false

[caches.images]
    dir = ":cacheDir/folio-deluxe/images"
    maxAge = "4320h"

[params]
    mainSections = ["collections"]
    description = "Photography shenanigans"
    palette = "paper"
    colorMode = "light"
    footerText = "Photography shenanigans"
    email = "james@toozej.photos"
    showCredit = true

    [params.author]
        name = "James Tooze"
        email = "james@toozej.photos"
        description = "Photography shenanigans"

    [params.images]
        quality = 85

    [params.robots]
        disallowAll = true

    [params.text]
        homeEmpty = "No collections published yet."
        allWork = "← All collections"
        nextStory = "Next collection →"
        viewAll = "View all →"
        notFoundLink = "Return to the collections →"

[[menus.main]]
    name = "Collections"
    pageRef = "/collections"
    weight = 10

[[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 20

[[menus.main]]
    name = "Feed"
    pageRef = "/feed"
    weight = 30

[[menus.main]]
    name = "Uses"
    pageRef = "/uses"
    weight = 40

[[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 50

[[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 60
