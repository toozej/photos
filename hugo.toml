baseURL = "https://photos.toozej.com"
enableRobotsTXT = true


[taxonomies]
    category = 'categories'

[caches]
    [caches.images]
        dir    = ':cacheDir/galleriesdeluxe'
        maxAge = "4320h"                     # 6 months.

[params]
    [params.author]
        name        = "James Tooze"
        email       = "james@toozej.photos"
        description = "Photography shenanigans"

    [params.galleriesdeluxe]
        gallery_section = "collections"
        galleries_alias = "collections"

        sass_transpiler = "dartsass"
        [params.galleriesdeluxe.sassvars]
            color_background       = "#08061c"
            color_background_dark  = "#08061c"
            color_text_dark        = "#ffffff"
            color_link_dark        = "#4586d5"
            color_background_light = "#e1dfdbf2"
            color_text_light       = "#000000"
            color_link_light       = "#2e299d"
            font_family_base       = '"Open Sans", "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", sans-serif'
            font_size_base         = "16px"

[params.gallerydeluxe]
    shuffle     = false
    reverse     = true
    enable_exif = false

    # [params.gallerydeluxe.watermark]
    #    image = "images/watermark.png" # relative to /assets
    #    posx  = "left"                    # one of "left", "center", "right"
    #    posy  = "bottom"                  # one of "top", "center", "bottom"

[module]
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "content"
        target = "content"

    [[module.imports]]
        path = "github.com/toozej/galleriesdeluxe"
