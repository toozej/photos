---
services:
  photos_hugo:
    container_name: photos_hugo
    image: floryn90/hugo:0.168.0-ext-alpine-onbuild
    restart: always
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    env_file:
      - hugo.env
    volumes:
      - ".:/src"
      - "./public:/target"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=false"
    command: --gc --watch --cleanDestinationDir
  photos_www:
    container_name: photos_www
    image: nginxinc/nginx-unprivileged:stable
    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.photos.entrypoints=http"
      - "traefik.http.routers.photos.rule=Host(`photos.test`)"
      - "traefik.http.routers.photos.middlewares=http-redirect-https@file,headers@file"
      - "traefik.http.routers.photos-secure.entrypoints=https"
      - "traefik.http.routers.photos-secure.rule=Host(`photos.test`)"
      - "traefik.http.routers.photos-secure.middlewares=headers@file"
      - "traefik.http.routers.photos-secure.tls=true"
    networks:
      - traefik
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf"
      - "./public:/var/www/html:ro"
networks:
  traefik:
    external: true
