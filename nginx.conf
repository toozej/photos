server{
    listen 8080;
    # Do not expose internal listen port (8080) in redirects
    absolute_redirect off;
    root /var/www/html;
    location ~* \.(jpe?g|jfif|png|apng|gif|avif|jxl|tiff?|bmp|heic|heif)$ {
        return 404;
    }
    location ~ / {
        allow all;
        root /var/www/html;
        autoindex on;
    }
}
